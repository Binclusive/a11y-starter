name: resolve-probe
on: pull_request
jobs:
  pr-write-only:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - &probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          id=$(gh api repos/$REPO/pulls/$PR/comments -f body="probe ${{ github.job }}" -f commit_id=$SHA -f path=.github/workflows/resolve-probe.yml -F line=1 -f side=RIGHT -q .id)
          echo "created comment $id"
          thread=$(gh api graphql -f query='query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){reviewThreads(first:50){nodes{id comments(first:1){nodes{databaseId}}}}}}}' -f o=${REPO%/*} -f n=${REPO#*/} -F p=$PR -q ".data.repository.pullRequest.reviewThreads.nodes[] | select(.comments.nodes[0].databaseId==$id) | .id")
          echo "thread $thread"
          gh api graphql -f query='mutation($t:ID!){resolveReviewThread(input:{threadId:$t}){thread{isResolved}}}' -f t=$thread || true
  pr-and-contents-write:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - *probe
  pr-write-contents-read:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - *probe
